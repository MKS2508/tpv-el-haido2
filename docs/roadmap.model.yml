# tpv-el-haido — modelo de roadmap (SSOT)
#
# Mutaciones SOLO vía axon CLI (`axon <cmd> --model docs/roadmap.model.yml`, o el MCP
# equivalente), nunca edición manual del contenido (mismo lock que desktop-release-hub
# dec-0001). Doc derivado: docs/ROADMAP.md — guard: `bun run check:roadmap`.
#
# Migrado desde roadmap.spec.yml (schema legacy phases/sub-phases, congelado en
# 2026-05-10, superseded por este modelo — ver git history si hace falta el original).
#
# Nota de bootstrap: este fichero contenedor se creó a mano porque axon 0.2.2 no trae
# comando de init — probado empírico dos veces: (1) parseModel requiere el fichero ya
# existente y schema-válido antes de que add-node pueda escribir nada (ENOENT contra
# fichero inexistente); (2) el editor text-surgical de add-node tampoco puede insertar el
# PRIMER nodo top-level en una seq `nodes: []` genuinamente vacía (`lastMapOf` revienta
# "seq vacía o sin map final" — no hay map previo del que anclar el insert). Por eso este
# nodo semilla (solo id/kind/status, sin título/gate/refs) se escribió a mano como el
# mínimo indispensable para que la seq tenga un ancla; TODO lo demás — este mismo nodo
# incluido (título/refs/gate vía set-node/set-gate) y cualquier nodo posterior — se
# añadió vía CLI/MCP, nunca a mano.

