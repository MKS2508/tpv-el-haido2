[package]
name = "tpv-el-haido"
version = "0.2.12"
description = "TPV: El Haido - Point of Sale System"
authors = ["El Haido Team"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tpv_el_haido_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "^2", features = [] }

[dependencies]
tauri = { version = "^2", features = [] }
tauri-plugin-opener = "^2"
tauri-plugin-http = "^2"
tauri-plugin-shell = "^2"
tauri-plugin-dialog = "^2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.11", features = ["json", "stream"] }
chrono = "0.4"
image = "0.24"
arboard = { version = "3.2", features = ["image"] }
base64 = "0.21"
ed25519-dalek = "2"
semver = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["time", "process", "fs", "io-util"] }
futures-util = "0.3"
shellexpand = "2"

# Canal OTA parcial + full extraído del propio crate (ADR-0045 D8-C, D10-D;
# commit 8df4138 en mks-ota ejecuta la extracción; ADR-0046 añade
# `install::full::linux` simétrico a macos para que esta app tenga full update
# en Linux + macOS).
#
# v0.3.0 = `install::full::linux` + `install::full::macos` (Lane A).
# `install::full::linux` está controlada por `#[cfg(target_os = "linux")]` en el
# código de mks-ota, NO por feature flag. Solo el feature `tauri` es necesario.
mks-ota = { git = "https://github.com/MKS2508/mks-ota", tag = "v0.3.0", default-features = false, features = ["tauri"] }

