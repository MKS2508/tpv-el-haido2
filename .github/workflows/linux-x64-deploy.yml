name: 🐧 Linux x64 Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  APPIMAGE_EXTRACT_AND_RUN: '1'

jobs:
  build-linux-x64:
    name: Build Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            minisign

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Requiere secret SOAP_AEAT_PAT (PAT classico 'repo' o fine-grained contents:read
      # sobre MKS2508/tpv-soap-aeat) — GITHUB_TOKEN no llega a repos privados cruzados.
      - name: Checkout tpv-soap-aeat (sidecar source)
        uses: actions/checkout@v7
        with:
          repository: MKS2508/tpv-soap-aeat
          path: tpv-soap-aeat
          token: ${{ secrets.SOAP_AEAT_PAT }}
          persist-credentials: false

      - name: Install tpv-soap-aeat dependencies
        working-directory: tpv-soap-aeat
        run: bun install --frozen-lockfile

      - name: Build + sign (linux-x64)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run scripts/build-release.ts --target linux-x64

      - name: List bundle output (confirma artifactExt real)
        run: find src-tauri/target/x86_64-unknown-linux-gnu/release/bundle -maxdepth 2 -type f

      - name: Verify signature against embedded pubkey
        run: |
          ARTIFACT=$(find releases -path "*/linux-x64/*" -name "*.AppImage" -not -name "*.sig" | head -1)
          if [ -z "$ARTIFACT" ]; then echo "::error::No .AppImage artifact found under releases/"; exit 1; fi
          base64 -d "${ARTIFACT}.sig" > /tmp/artifact.minisig
          minisign -Vm "$ARTIFACT" -x /tmp/artifact.minisig \
            -P RWTSIzayxELfO5VU3bpUnjiycxqhvdT3C95KUqkXKhogRtLKwuXgLZgt

      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64-release
          path: releases/*/linux-x64/**
          if-no-files-found: error
          retention-days: 30

      - name: Publish to release-hub (API key preferred, client_credentials fallback, fail-loud — r8)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_HUB_API_KEY: ${{ secrets.RELEASE_HUB_API_KEY }}
          RELEASE_HUB_CLIENT_ID: ${{ secrets.RELEASE_HUB_CLIENT_ID }}
          RELEASE_HUB_CLIENT_SECRET: ${{ secrets.RELEASE_HUB_CLIENT_SECRET }}
        run: |
          # Release notes: read from docs/releases/<version>-notes.md if present, else empty.
          # Generated locally by `bun run scripts/release.ts publish --ai-notes` and committed
          # next to the workflow. Pattern: releases/ in .gitignore unanchored → exception !docs/releases/
          # keeps the markdown tracked. Workflow never fails on missing file (graceful fallback).
          NOTES_FILE="docs/releases/${GITHUB_REF_NAME}-notes.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "::warning::Notes file $NOTES_FILE not found — publishing without --notes."
          fi
          NOTES_CONTENT="$(cat "$NOTES_FILE" 2>/dev/null || echo '')"

          publish_ok=false
          if [ -n "$RELEASE_HUB_API_KEY" ]; then
            echo "Publishing via API key (preferred path)..."
            if bun run scripts/release.ts publish --skip-build --target linux-x64 --slug haido --component tpv-el-haido --notes "$NOTES_CONTENT"; then
              echo "## Publish al release-hub: OK (API key, preferred path — r8)" >> "$GITHUB_STEP_SUMMARY"
              publish_ok=true
            else
              echo "::error::Publish via API key failed"
            fi
          elif [ -n "$RELEASE_HUB_CLIENT_ID" ] && [ -n "$RELEASE_HUB_CLIENT_SECRET" ]; then
            echo "Publishing via client_credentials (fallback — known broken since auth-oidc-elysia@0.2.0, kept for emergency only)..."
            if bun run scripts/release.ts publish --client-credentials --skip-build --target linux-x64 --slug haido --notes "$NOTES_CONTENT"; then
              echo "## Publish al release-hub: OK (client_credentials fallback)" >> "$GITHUB_STEP_SUMMARY"
              publish_ok=true
            else
              echo "::error::Publish via client_credentials failed"
            fi
          else
            echo "RELEASE_HUB_API_KEY + RELEASE_HUB_CLIENT_ID/SECRET no están seteados — manual fallback"
            {
              echo "## Publish al release-hub (manual, interim)"
              echo ""
              echo "1. Download artifact \`linux-x64-release\` de este run"
              echo "2. \`bun run scripts/release.ts publish --api-key \$RELEASE_HUB_API_KEY --skip-build --target linux-x64 --slug haido\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$publish_ok" = "false" ]; then
            exit 1
          fi
