name: 🐧 Linux x64 Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  APPIMAGE_EXTRACT_AND_RUN: '1'

jobs:
  build-linux-x64:
    name: Build Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            minisign

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build + sign (linux-x64)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run scripts/build-release.ts --target linux-x64

      - name: List bundle output (confirma artifactExt real)
        run: find src-tauri/target/x86_64-unknown-linux-gnu/release/bundle -maxdepth 2 -type f

      - name: Verify signature against embedded pubkey
        run: |
          ARTIFACT=$(find releases -path "*/linux-x64/*" -name "*.AppImage" -not -name "*.sig" | head -1)
          if [ -z "$ARTIFACT" ]; then echo "::error::No .AppImage artifact found under releases/"; exit 1; fi
          base64 -d "${ARTIFACT}.sig" > /tmp/artifact.minisig
          minisign -Vm "$ARTIFACT" -x /tmp/artifact.minisig \
            -P RWSxu04zRL8L250wN61H4xvaSW8GmAGBOIPtqmRbKw6C9ZNlC9VrlUUU

      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64-release
          path: releases/*/linux-x64/**
          if-no-files-found: error
          retention-days: 30

      - name: Publish to release-hub (auto si hay secrets, fallback manual — TR-15)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_HUB_CLIENT_ID: ${{ secrets.RELEASE_HUB_CLIENT_ID }}
          RELEASE_HUB_CLIENT_SECRET: ${{ secrets.RELEASE_HUB_CLIENT_SECRET }}
        run: |
          manual_instructions() {
            {
              echo "## Publish al release-hub (manual, interim — TR-12 opción 3 / fallback TR-15)"
              echo ""
              echo "1. Descargar el artifact \`linux-x64-release\` de este run."
              echo "2. Colocarlo en \`releases/<version>/linux-x64/\` en tu checkout local."
              echo "3. \`bun run scripts/release.ts auth login\` (si no hay sesión activa)."
              echo "4. \`bun run scripts/release.ts publish --target linux-x64 --slug haido --skip-build\`"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          if [ -z "$RELEASE_HUB_CLIENT_ID" ] || [ -z "$RELEASE_HUB_CLIENT_SECRET" ]; then
            echo "RELEASE_HUB_CLIENT_ID/SECRET no están seteados — fallback manual (TR-15 paso 2)."
            manual_instructions
            exit 0
          fi

          if bun run scripts/release.ts publish --client-credentials --skip-build --target linux-x64 --slug haido; then
            echo "## Publish al release-hub: OK (automático, client_credentials — TR-15)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Publish automático falló — fallback a instrucciones manuales (TR-15 paso 2)."
            manual_instructions
          fi
