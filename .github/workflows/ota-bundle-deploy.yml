name: 📦 OTA Bundle (JS partial channel)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'tsconfig.node.json'
      - 'package.json'
      - 'bun.lock'
      - 'src-tauri/ota-bundle-pubkey.txt'
      - 'scripts/build-bundle.ts'
  workflow_dispatch:
    inputs:
      min_native_version:
        description: 'minNativeVersion override (default: src-tauri/tauri.conf.json version)'
        required: false
        type: string
      max_native_version:
        description: 'maxNativeVersion override (default: same as min)'
        required: false
        type: string

jobs:
  build-ota-bundle:
    name: Build + sign + publish OTA bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install minisign
        # Necesario para build-bundle.ts pack (firma local) y para el verify
        # step local. En macOS viene por defecto; en Ubuntu hay que traerlo.
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend (typecheck + vite build)
        run: bun run build

      - name: Restore OTA signing key
        env:
          OTA_KEY: ${{ secrets.OTA_BUNDLE_SIGNING_PRIVATE_KEY }}
        run: |
          [ -n "$OTA_KEY" ] || { echo "::error::secret OTA_BUNDLE_SIGNING_PRIVATE_KEY no seteado"; exit 1; }
          mkdir -p tauri-keys
          printf '%s' "$OTA_KEY" > tauri-keys/ota-bundle.key
          chmod 600 tauri-keys/ota-bundle.key

      - name: Resolve version window + bundle id
        id: meta
        run: |
          DEFAULT_VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          MIN="${{ inputs.min_native_version }}"
          MAX="${{ inputs.max_native_version }}"
          echo "min=${MIN:-$DEFAULT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "max=${MAX:-$DEFAULT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=$(date -u +%Y.%m.%d)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Pack + sign bundle (minisign, target=any/arch=any)
        run: |
          bun run scripts/build-bundle.ts pack \
            --min "${{ steps.meta.outputs.min }}" \
            --max "${{ steps.meta.outputs.max }}" \
            --version "${{ steps.meta.outputs.version }}"

      - name: Verify contract (index.html root, manifest shape, minisign sig)
        run: |
          BUNDLE_DIR="releases/bundles/${{ steps.meta.outputs.version }}"
          MANIFEST="$BUNDLE_DIR/manifest.json"
          SIG="$BUNDLE_DIR/bundle.zip.minisig"
          test -f "$MANIFEST" || { echo "::error::manifest.json not found in $BUNDLE_DIR"; exit 1; }
          test -f "$SIG" || { echo "::error::bundle.zip.minisig not found in $BUNDLE_DIR"; exit 1; }
          unzip -l "$BUNDLE_DIR/bundle.zip" | awk '{print $NF}' | grep -qx 'index.html' \
            || { echo "::error::bundle.zip missing root index.html"; exit 1; }
          jq -e '.bundleVersion | test("^[0-9]{4}\\.[0-9]{2}\\.[0-9]{2}-[0-9]+$")' "$MANIFEST" > /dev/null \
            || { echo "::error::bundleVersion does not match contract"; exit 1; }
          jq -e '.hash | test("^sha256:[0-9a-f]{64}$")' "$MANIFEST" > /dev/null \
            || { echo "::error::hash does not match contract"; exit 1; }
          jq -e '.signature | startswith("untrusted comment: signature from minisign")' "$MANIFEST" > /dev/null \
            || { echo "::error::signature is not minisign .sig text"; exit 1; }
          jq -e '.component == "haido-frontend"' "$MANIFEST" > /dev/null \
            || { echo "::error::component != haido-frontend"; exit 1; }
          jq -e '.target == "any" and .arch == "any"' "$MANIFEST" > /dev/null \
            || { echo "::error::target/arch != any (must be L3 platform-agnostic)"; exit 1; }
          echo "Contract OK: $MANIFEST"

      - name: Verify minisign signature against embedded pubkey (fail-closed)
        run: |
          BUNDLE_DIR="releases/bundles/${{ steps.meta.outputs.version }}"
          PUBKEY=$(cat src-tauri/ota-bundle-pubkey.txt)
          minisign -Vm "$BUNDLE_DIR/bundle.zip" \
            -P "$PUBKEY" \
            -x "$BUNDLE_DIR/bundle.zip.minisig" \
            || { echo "::error::minisign verification FAILED"; exit 1; }
          echo "minisign verification OK"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ota-bundle-${{ steps.meta.outputs.version }}
          path: releases/bundles/${{ steps.meta.outputs.version }}/**
          if-no-files-found: error
          retention-days: 30

      - name: Publish to release-hub /api/admin/projects/{slug}/components (fail-closed)
        env:
          RELEASE_HUB_CLIENT_ID: ${{ secrets.RELEASE_HUB_CLIENT_ID }}
          RELEASE_HUB_CLIENT_SECRET: ${{ secrets.RELEASE_HUB_CLIENT_SECRET }}
        run: |
          if [ -z "$RELEASE_HUB_CLIENT_ID" ] || [ -z "$RELEASE_HUB_CLIENT_SECRET" ]; then
            echo "::error::RELEASE_HUB_CLIENT_ID/SECRET no están seteados — D10-D exige client_credentials al /components (minisign verify contra kind=binary). Sin credenciales el publish falla cerrado, no cae a manual."
            exit 1
          fi

          bun run scripts/release.ts publish-bundle \
            --slug haido \
            --component haido-frontend \
            --target any \
            --arch any \
            --client-credentials \
            --skip-build \
            --bundle "releases/bundles/${{ steps.meta.outputs.version }}/bundle.zip"
