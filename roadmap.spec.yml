decisions:
  - label: "desktop-release-hub multi-tenant + auth-oidc-elysia"
    date: "2026-05-10"
    summary: "Hub agnóstico (no específico haido/Tauri) reemplaza updates+admin de tpv-cloud. Multi-tenant via subdomain. Auth Pocket ID OIDC PKCE para CLI. Multi-repo: auth plugin (npm) + hub (deploy)."
    rationale: "Reusable para futuros desktop apps. Plugin auth desacoplado. URLs limpias por subdomain. CLI auth sin credenciales long-lived (estilo gh/vercel CLI)."
    lockedBy: "user-interview-r2-2-rondas"
    docRef: "docs/decisions/r2-release-hub-architecture-2026-05-10.md"

  - label: "Path pragmático tonight: hub MVP + smoke, admin UI post-prod"
    date: "2026-05-10"
    summary: "Server multi-tenant + auth + admin endpoints + CLI publish + smoke OTA esta noche. Admin UI react = sprint post-prod."
    rationale: "Foco en validar update flow end-to-end esta noche. Admin UI es 4h aisladas, lockable después con server estable."
    lockedBy: "user-interview-r2"
    docRef: "docs/decisions/r2-release-hub-architecture-2026-05-10.md"

  - label: "Production milestone priority"
    date: "2026-05-09"
    summary: "Auto-updates + thermal printers eran críticos. Printer postponed a 0.5.0 deferred."
    rationale: "Limited access to Windows machine at brother's bar"
    lockedBy: "user-requirement"

  - label: "Coolify migration"
    date: "2026-05-09"
    summary: "Migrate license server + docs to Coolify for unified infrastructure"
    rationale: "Better control of updates, releases, and remote management"
    lockedBy: "user-requirement"

  - label: "Sin GitHub - distribución 100% propia"
    date: "2026-05-09"
    summary: "Auto-updater Tauri y binarios servidos desde Coolify (updates.mks2508.systems), no GitHub Releases ni Actions"
    rationale: "Eliminar SPOF, control release process, stack unificado"
    lockedBy: "user-requirement"
    docRef: "docs/decisions/r1-deployment-architecture-2026-05-09.md"

  - label: "Arquitectura tpv-cloud unified"
    date: "2026-05-09"
    summary: "Un servicio Bun + Elysia + Drizzle consolida updates + license validation"
    rationale: "Mismo stack, una app a mantener, replace license-server roto"
    lockedBy: "user-interview-r1"
    docRef: "docs/decisions/r1-deployment-architecture-2026-05-09.md"

  - label: "DB nueva tpv-cloud-db en project haido"
    date: "2026-05-09"
    summary: "PostgreSQL dedicada via coolify-cli db create, no reusar mks-postgres cross-project"
    rationale: "Project haido tiene 0 DBs, isolation correcta, pattern Coolify estándar"
    lockedBy: "user-interview-r1"
    docRef: "docs/decisions/r1-deployment-architecture-2026-05-09.md"

  - label: "Build Windows en bar (1 vez)"
    date: "2026-05-09"
    summary: "Build NSIS directo en PC del bar via SSH/AnyDesk. dockur/windows descartado (Hetzner Cloud sin KVM nested)"
    rationale: "Cero risk cross-compile, garantizado, después todo via OTA"
    lockedBy: "user-interview-r1"
    docRef: "docs/decisions/r1-deployment-architecture-2026-05-09.md"

  - label: "Printer (0.5.0) postpone"
    date: "2026-05-09"
    summary: "Postpone scope tonight, re-evaluar arquitectura cuando waxin pueda testear hardware"
    rationale: "Critical path tonight es update + instalador, printer requiere research hardware"
    lockedBy: "user-interview-r1"

